# Repurposes the existing minha.sinmpla.com.br vhost (currently a static
# landing page at /var/www/minha-landing) to reverse-proxy to the new app
# container instead. Certbot has already issued a cert for this domain, so
# this only swaps the "location /" block — same TLS lines Certbot added.
#
# To apply on the VPS:
#   cp deploy/nginx-minha.sinmpla.com.br.conf /etc/nginx/sites-available/minha.sinmpla.com.br.conf
#   nginx -t && systemctl reload nginx

server {
    server_name minha.sinmpla.com.br;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/minha.sinmpla.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/minha.sinmpla.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = minha.sinmpla.com.br) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name minha.sinmpla.com.br;
    return 404; # managed by Certbot
}
